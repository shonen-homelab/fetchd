name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: test
        run: go test -race ./...

  image:
    # Dockerfile lands in PR5; steps no-op until then so main stays green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-main
    steps:
      - uses: actions/checkout@v4
      - id: dockerfile
        run: test -f Dockerfile && echo exists=true >> "$GITHUB_OUTPUT" || echo exists=false >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.dockerfile.outputs.exists == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.dockerfile.outputs.exists == 'true'
      - uses: docker/login-action@v3
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          images: ghcr.io/shonen-homelab/fetchd
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        if: steps.dockerfile.outputs.exists == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
